name: executeos
description: AI-Powered Execution & Accountability Platform. Help people and teams turn commitments into completed work.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  intl: ^0.20.2

  # Local storage & offline
  hive_ce: ^2.11.1
  hive_ce_flutter: ^2.2.0
  path_provider: ^2.1.5

  # Networking (for later Supabase / custom API)
  dio: ^5.8.0+1
  supabase_flutter: ^2.9.0

  # Utils
  uuid: ^4.5.1
  collection: ^1.19.1
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  hive_ce_generator: ^1.8.2

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/
